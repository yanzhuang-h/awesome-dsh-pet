  <style>
    .eyes-happy, .eyes-blink { opacity: 0; }
    .eyes-open { animation: mochi-blink-open 6.4s infinite; }
    .eyes-blink { animation: mochi-blink-shut 6.4s infinite; }
    .tail { transform-box: view-box; transform-origin: 232px 252px; animation: mochi-tail 4.8s ease-in-out infinite; }
    .ear-left { transform-box: view-box; transform-origin: 105px 120px; animation: mochi-ear-left 8.6s ease-in-out infinite; }
    .ear-right { transform-box: view-box; transform-origin: 195px 120px; animation: mochi-ear-right 8.6s ease-in-out -3.2s infinite; }
    .sparkle-a { animation: mochi-twinkle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle-b { animation: mochi-twinkle 5.1s ease-in-out -1.4s infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle-c { animation: mochi-twinkle-small 3.6s ease-in-out -0.8s infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle-d { animation: mochi-twinkle-small 4.7s ease-in-out -2.2s infinite; transform-box: fill-box; transform-origin: center; }
    .mochi-float { animation: mochi-float 4.4s ease-in-out infinite; transform-box: view-box; transform-origin: 150px 300px; }
    @keyframes mochi-float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.006); } }
    @keyframes mochi-blink-open { 0%,92%,100% { opacity: 1; } 93%,95% { opacity: 0; } }
    @keyframes mochi-blink-shut { 0%,92%,100% { opacity: 0; } 93%,95% { opacity: 1; } }
    @keyframes mochi-tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3.6deg); } }
    @keyframes mochi-ear-left { 0%,86%,100% { transform: rotate(0deg); } 88% { transform: rotate(-4deg); } 91% { transform: rotate(1.8deg); } 94% { transform: rotate(-1deg); } }
    @keyframes mochi-ear-right { 0%,82%,100% { transform: rotate(0deg); } 84% { transform: rotate(3.2deg); } 88% { transform: rotate(-1.5deg); } }
    @keyframes mochi-twinkle { 0%,100% { opacity: .35; transform: translateY(2px) scale(.88) rotate(0); } 50% { opacity: 1; transform: translateY(-5px) scale(1.06) rotate(8deg); } }
    @keyframes mochi-twinkle-small { 0%,100% { opacity: .28; transform: scale(.9); } 50% { opacity: .9; transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .mochi-float,.eyes-open,.eyes-blink,.tail,.ear-left,.ear-right,.sparkle { animation: none !important; } }

    .eyes-open { opacity: 0; animation: none !important; }
    .eyes-blink { opacity: 0; animation: none !important; }
    .eyes-happy { opacity: 1 !important; }</style>

