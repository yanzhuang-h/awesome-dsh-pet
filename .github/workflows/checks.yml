name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild client bundle
        run: npm run build

      - name: Ensure built client is committed
        run: git diff --exit-code -- client.js

      - name: Validate plugin manifest and syntax
        run: npm run check
